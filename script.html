<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUB — Script Mode</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #1e1e1e;
    --accent: #c8f135;
    --accent-dim: #8aaa20;
    --text: #e8e8e8;
    --muted: #555;
    --red: #ff4444;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px;
    gap: 0;
  }

  header {
    width: 100%;
    max-width: 680px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
  }

  .logo {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .logo span { color: var(--accent); }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .status-dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* Intent input */
  .intent-wrap {
    width: 100%;
    max-width: 680px;
    margin-bottom: 48px;
  }

  .intent-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .intent-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    caret-color: var(--accent);
  }

  .intent-input:focus { border-color: var(--accent-dim); }
  .intent-input::placeholder { color: var(--muted); }

  /* Mic zone */
  .mic-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    margin-bottom: 56px;
  }

  .mic-btn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, transform 0.1s;
    position: relative;
    outline: none;
  }

  .mic-btn svg { color: var(--muted); transition: color 0.2s; }

  .mic-btn:hover { border-color: var(--accent-dim); }
  .mic-btn:hover svg { color: var(--accent-dim); }
  .mic-btn:active { transform: scale(0.96); }

  .mic-btn.listening {
    border-color: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .mic-btn.listening svg { color: var(--accent); }

  .mic-btn.listening::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1px solid var(--accent);
    opacity: 0;
    animation: ripple 1.4s ease-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,241,53,0.15); }
    50% { box-shadow: 0 0 0 16px rgba(200,241,53,0); }
  }

  @keyframes ripple {
    0% { transform: scale(1); opacity: 0.4; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  .mic-hint {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Conversation feed */
  .feed {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .bubble {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .bubble.you .bubble-label { color: var(--muted); }
  .bubble.nub .bubble-label { color: var(--accent-dim); }

  .bubble-text {
    font-size: 16px;
    line-height: 1.55;
    color: var(--text);
  }

  .bubble.you .bubble-text { color: #888; }
  .bubble.nub .bubble-text { color: var(--text); }

  /* blinking cursor while streaming */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* voice toggle */
  .voice-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: border-color 0.2s, color 0.2s;
    outline: none;
  }
  .voice-toggle.on { border-color: var(--accent-dim); color: var(--accent); }
  .voice-toggle:hover { border-color: var(--accent-dim); }

  /* no-speech note */
  .nosupport {
    color: var(--red);
    font-size: 12px;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>NUB</span> / script mode</div>
  <div class="status-dot" id="dot"></div>
</header>

<div class="intent-wrap">
  <div class="intent-label">Session intent</div>
  <input
    class="intent-input"
    id="intent"
    type="text"
    placeholder="what are we building right now..."
    autocomplete="off"
    spellcheck="false"
  >
</div>

<div class="mic-zone">
  <button class="mic-btn" id="micBtn" title="Hold Space or click to talk">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <div class="mic-hint" id="micHint">click or hold space</div>
</div>

<div class="feed" id="feed"></div>

<button class="voice-toggle on" id="voiceToggle">voice on</button>

<script>
const micBtn    = document.getElementById('micBtn');
const micHint   = document.getElementById('micHint');
const feed      = document.getElementById('feed');
const dot       = document.getElementById('dot');
const voiceBtn  = document.getElementById('voiceToggle');
const intentEl  = document.getElementById('intent');

let voiceOn     = true;
let listening   = false;
let recognition = null;
let synth       = window.speechSynthesis;
let voices      = [];
let chosenVoice = null;
let speechQueue = [];
let speaking    = false;
let currentNubBubble = null;
let currentNubText   = '';

// ── Voice setup ─────────────────────────────────────────────────────────────
function loadVoices() {
  voices = synth.getVoices();
  // priority: deep/natural male english voices — nonchalant vibe
  const preferred = [
    'Google UK English Male',
    'Microsoft Guy Online (Natural) - English (United States)',
    'Microsoft Davis Online (Natural) - English (United States)',
    'Google US English',
    'en-US-GuyNeural',
  ];
  for (const name of preferred) {
    const v = voices.find(v => v.name === name);
    if (v) { chosenVoice = v; break; }
  }
  if (!chosenVoice) {
    // fallback: any english male
    chosenVoice = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male'))
      || voices.find(v => v.lang.startsWith('en'))
      || voices[0];
  }
}

synth.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
  if (!voiceOn || !text.trim()) return;
  speechQueue.push(text.trim());
  if (!speaking) drainQueue();
}

function drainQueue() {
  if (!speechQueue.length) { speaking = false; return; }
  speaking = true;
  const utt = new SpeechSynthesisUtterance(speechQueue.shift());
  utt.voice = chosenVoice;
  utt.rate  = 0.88;   // relaxed, not rushed
  utt.pitch = 0.82;   // lower = more chill
  utt.volume = 1;
  utt.onend = () => drainQueue();
  utt.onerror = () => drainQueue();
  synth.speak(utt);
}

// ── Bubble helpers ───────────────────────────────────────────────────────────
function addBubble(role, text) {
  const b = document.createElement('div');
  b.className = `bubble ${role}`;
  b.innerHTML = `<div class="bubble-label">${role === 'you' ? 'you' : 'nub'}</div><div class="bubble-text">${text}</div>`;
  feed.appendChild(b);
  b.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return b;
}

function startNubBubble() {
  currentNubText = '';
  currentNubBubble = addBubble('nub', '');
  const textEl = currentNubBubble.querySelector('.bubble-text');
  textEl.innerHTML = '<span class="cursor"></span>';
  return textEl;
}

function appendNubText(textEl, chunk) {
  currentNubText += chunk;
  textEl.textContent = currentNubText;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  textEl.appendChild(cursor);
}

function finishNubBubble(textEl) {
  textEl.textContent = currentNubText;
  currentNubBubble = null;
  currentNubText   = '';
}

// ── Chat + streaming ─────────────────────────────────────────────────────────
async function sendMessage(text) {
  if (!text.trim()) return;
  dot.classList.add('live');
  addBubble('you', text);

  const textEl = startNubBubble();
  let buffer   = '';
  let fullResp = '';

  try {
    const res = await fetch('/script/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ intent: intentEl.value.trim(), message: text })
    });

    const reader = res.body.getReader();
    const dec    = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const lines = dec.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (payload === '[DONE]') break;
        try {
          const { text: t, error } = JSON.parse(payload);
          if (error) { appendNubText(textEl, '[error]'); break; }
          if (!t) continue;

          appendNubText(textEl, t);
          buffer   += t;
          fullResp += t;

          // speak sentence by sentence for low latency
          const sentenceEnd = /[.!?…]\s*/g;
          let match;
          let lastIdx = 0;
          sentenceEnd.lastIndex = 0;
          while ((match = sentenceEnd.exec(buffer)) !== null) {
            const sentence = buffer.slice(lastIdx, match.index + match[0].length).trim();
            if (sentence) speak(sentence);
            lastIdx = match.index + match[0].length;
          }
          buffer = buffer.slice(lastIdx);

        } catch { /* partial chunk */ }
      }
    }

    // speak any trailing text
    if (buffer.trim()) speak(buffer.trim());

  } catch (err) {
    appendNubText(textEl, 'connection dropped.');
    speak('connection dropped.');
  }

  finishNubBubble(textEl);
  dot.classList.remove('live');
}

// ── Speech recognition ───────────────────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  micHint.textContent = 'speech api not supported — try chrome';
  micHint.classList.add('nosupport');
  micBtn.disabled = true;
} else {
  recognition = new SpeechRecognition();
  recognition.continuous      = false;
  recognition.interimResults  = true;
  recognition.lang            = 'en-US';
  recognition.maxAlternatives = 1;

  let interimText = '';
  let finalText   = '';

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    micHint.textContent = 'listening...';
    interimText = '';
    finalText   = '';
  };

  recognition.onresult = (e) => {
    interimText = '';
    finalText   = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText   += e.results[i][0].transcript;
      else                       interimText += e.results[i][0].transcript;
    }
    micHint.textContent = finalText || interimText || 'listening...';
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    micHint.textContent = 'click or hold space';
    const said = (finalText || interimText).trim();
    if (said) {
      // cancel any ongoing speech so NUB responds to new command immediately
      synth.cancel();
      speaking = false;
      speechQueue = [];
      sendMessage(said);
    }
  };

  recognition.onerror = (e) => {
    listening = false;
    micBtn.classList.remove('listening');
    micHint.textContent = e.error === 'no-speech' ? 'no speech detected' : `error: ${e.error}`;
    setTimeout(() => { micHint.textContent = 'click or hold space'; }, 2000);
  };

  function startListening() {
    if (listening) return;
    // stop NUB mid-sentence when you start talking — feels natural
    synth.cancel();
    speaking = false;
    speechQueue = [];
    try { recognition.start(); } catch(e) {}
  }

  function stopListening() {
    if (!listening) return;
    try { recognition.stop(); } catch(e) {}
  }

  micBtn.addEventListener('click', () => {
    if (listening) stopListening();
    else startListening();
  });

  // spacebar hold-to-talk
  let spaceHeld = false;
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.target.matches('input,textarea') && !spaceHeld) {
      e.preventDefault();
      spaceHeld = true;
      startListening();
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'Space' && spaceHeld) {
      spaceHeld = false;
      stopListening();
    }
  });
}

// ── Voice toggle ─────────────────────────────────────────────────────────────
voiceBtn.addEventListener('click', () => {
  voiceOn = !voiceOn;
  if (!voiceOn) { synth.cancel(); speaking = false; speechQueue = []; }
  voiceBtn.textContent = voiceOn ? 'voice on' : 'voice off';
  voiceBtn.classList.toggle('on', voiceOn);
});
</script>
</body>
</html>
